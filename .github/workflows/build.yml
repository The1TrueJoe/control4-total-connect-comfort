name: Build c4z

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua (syntax validation)
        run: sudo apt-get install -y lua5.3 && sudo ln -sf /usr/bin/luac5.3 /usr/local/bin/luac

      - name: Run logic tests
        run: lua5.3 driver/test/test_logic.lua

      - name: Concatenate source files
        run: |
          {
            echo '-- Total Connect Comfort Thermostat Driver'
            echo '-- AUTO-GENERATED by build.sh — edit driver/src/ instead.'
            echo '---@diagnostic disable: undefined-global'
            for f in driver/src/*.lua; do echo; cat "$f"; done
          } > driver/driver.lua
          echo "Built driver/driver.lua ($(wc -l < driver/driver.lua) lines)"

      - name: Validate Lua syntax
        run: luac -p driver/driver.lua && echo "OK  driver/driver.lua"

      - name: Stamp driver.xml
        run: |
          BUILD_DATE=$(date +"%m/%d/%Y %H:%M")
          VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          sed -i "s|<modified>.*</modified>|<modified>${BUILD_DATE}</modified>|" driver/driver.xml
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" driver/driver.xml
          echo "version=${VERSION}  modified=${BUILD_DATE}"

      - name: Package driver (total_connect_comfort.c4z)
        uses: snap-one/drivers-driverpackager@v2-rc4
        with:
          projectDir: './driver'
          c4zproj: 'total_connect_comfort.c4zproj'
          outputDir: '..'  # relative to projectDir → repo root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: total_connect_comfort
          path: total_connect_comfort.c4z

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" total_connect_comfort.c4z --clobber
